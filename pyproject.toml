[project]
name = "reviewr"
version = "0.1.0"
description = "Multi-AI consensus code reviewer: several AI CLIs review a PR, share findings blindly, debate to convergence, then compose one edited review."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.scripts]
reviewr = "reviewr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewr"]
